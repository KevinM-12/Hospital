<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Fachada del hospital Sana Sana">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8e0" />
      <stop offset="1" stop-color="#f3faf7" />
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4e3df" />
      <stop offset="1" stop-color="#8cbdb6" />
    </linearGradient>
    <pattern id="ventanas" width="60" height="50" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="42" height="32" rx="3" fill="url(#vidrio)" />
    </pattern>
  </defs>

  <!-- cielo, sol y colinas -->
  <rect width="800" height="440" fill="url(#cielo)" />
  <circle cx="680" cy="86" r="42" fill="#fff6d8" opacity="0.95" />
  <path d="M0 300 Q200 235 400 285 T800 270 V440 H0 Z" fill="#cfe6dc" />
  <rect y="362" width="800" height="78" fill="#e3eee8" />

  <!-- alas laterales -->
  <rect x="60" y="226" width="130" height="136" fill="#f2f7f5" />
  <rect x="50" y="210" width="150" height="18" fill="#2b7f76" />
  <rect x="60" y="250" width="120" height="100" fill="url(#ventanas)" />
  <rect x="600" y="226" width="140" height="136" fill="#f2f7f5" />
  <rect x="600" y="210" width="150" height="18" fill="#2b7f76" />
  <rect x="600" y="250" width="120" height="100" fill="url(#ventanas)" />

  <!-- edificio central -->
  <rect x="180" y="170" width="420" height="192" fill="#fbfdfc" />
  <rect x="160" y="150" width="460" height="26" fill="#17645d" />
  <rect x="180" y="200" width="420" height="100" fill="url(#ventanas)" />

  <!-- entrada con techo de madera -->
  <rect x="320" y="296" width="140" height="66" fill="#fbfdfc" />
  <rect x="300" y="290" width="180" height="14" fill="#b98a5b" />
  <rect x="334" y="312" width="112" height="50" fill="url(#vidrio)" />
  <rect x="388" y="312" width="4" height="50" fill="#fbfdfc" />
  <rect x="312" y="304" width="8" height="58" fill="#d9b88f" />
  <rect x="460" y="304" width="8" height="58" fill="#d9b88f" />

  <!-- cruz del hospital -->
  <circle cx="390" cy="160" r="22" fill="#ffffff" />
  <path d="M385 146h10v10h10v10h-10v10h-10v-10h-10v-10h10z" fill="#17645d" />

  <!-- camino -->
  <path d="M340 362 H440 L520 440 H260 Z" fill="#f4f1e6" />

  <!-- árboles -->
  <rect x="28" y="318" width="10" height="46" fill="#8a6a4a" />
  <circle cx="33" cy="302" r="34" fill="#4f9a82" />
  <circle cx="58" cy="322" r="24" fill="#3f866f" />
  <rect x="762" y="322" width="10" height="42" fill="#8a6a4a" />
  <circle cx="767" cy="304" r="32" fill="#4f9a82" />
  <circle cx="742" cy="326" r="22" fill="#3f866f" />
  <rect x="226" y="338" width="8" height="26" fill="#8a6a4a" />
  <circle cx="230" cy="330" r="22" fill="#5aa88f" />
  <rect x="566" y="338" width="8" height="26" fill="#8a6a4a" />
  <circle cx="570" cy="330" r="22" fill="#5aa88f" />
</svg>
